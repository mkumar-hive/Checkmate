version: '3.8'

services:
  # Frontend Service
  client:
    build:
      context: .
      dockerfile: ./docker/production/client.Dockerfile
      args:
        VITE_APP_API_BASE_URL: ${CLIENT_API_URL:-http://localhost/api/v1}
        VITE_APP_CLIENT_HOST: ${CLIENT_HOST:-http://localhost}
    image: checkmate-client:latest
    container_name: checkmate-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      UPTIME_APP_API_BASE_URL: ${CLIENT_API_URL:-http://localhost:52345/api/v1}
      UPTIME_APP_CLIENT_HOST: ${CLIENT_HOST:-http://localhost}
    volumes:
      - ./docker/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/production/nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (if using HTTPS)
      - ./ssl/certs:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - checkmate-network

  # Backend Service
  server:
    build:
      context: .
      dockerfile: ./docker/production/server.Dockerfile
    image: checkmate-server:latest
    container_name: checkmate-server
    restart: unless-stopped
    ports:
      - "52345:52345"
    environment:
      NODE_ENV: production
      PORT: 52345
      CLIENT_HOST: ${CLIENT_HOST:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_TTL: ${TOKEN_TTL:-86400}
      DB_CONNECTION_STRING: mongodb://checkmate_app:checkmate_password@mongodb:27017/checkmate?authSource=checkmate
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Email settings (optional)
      SYSTEM_EMAIL_HOST: ${SYSTEM_EMAIL_HOST}
      SYSTEM_EMAIL_PORT: ${SYSTEM_EMAIL_PORT}
      SYSTEM_EMAIL_USER: ${SYSTEM_EMAIL_USER}
      SYSTEM_EMAIL_PASSWORD: ${SYSTEM_EMAIL_PASSWORD}
      SYSTEM_EMAIL_FROM: ${SYSTEM_EMAIL_FROM}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # For Docker monitoring (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For persistent logs
      - ./logs/server:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - checkmate-network

  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: checkmate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: checkmate
    volumes:
      - mongodb_data:/data/db
      - ./docker/production/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - checkmate-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: checkmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - checkmate-network

  # Optional: Capture Agent for Infrastructure Monitoring
  # capture:
  #   image: ghcr.io/bluewave-labs/capture:latest
  #   container_name: checkmate-capture
  #   restart: unless-stopped
  #   ports:
  #     - "59232:59232"
  #   environment:
  #     API_SECRET: ${CAPTURE_API_SECRET:-your-capture-secret}
  #     GIN_MODE: release
  #   volumes:
  #     - /etc/os-release:/etc/os-release:ro
  #   networks:
  #     - checkmate-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  checkmate-network:
    driver: bridge